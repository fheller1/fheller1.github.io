# Frederik Heller — Minimal Light
# Theme styles are vendored at assets/minimal-light and _sass/minimal-light.scss.
title: Frederik Heller
position: Master's student in Computational Engineering
affiliation: Technische Universität Darmstadt
affiliation_link: https://www.tu-darmstadt.de/
description: Frederik Heller — robotics, learning, and deformable object manipulation.
keywords: Frederik Heller, robotics, graph neural networks, tactile sensing
lang: en
url: https://fheller.dev
baseurl: ""
avatar: /assets/img/headshot.jpg
enable_footnote: true

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
sass:
  style: compressed

# Keep existing personal content; leave al-folio examples available in source.
include: ["_pages"]
exclude:
  - _posts
  - _books
  - _projects
  - _plugins
  - _scripts
  - _pages/blog.md
  - _pages/books.md
  - _pages/cv.md
  - _pages/dropdown.md
  - _pages/profiles.md
  - _pages/projects.md
  - _pages/repositories.md
  - _pages/teaching.md
  - assets/audio
  - assets/bibliography
  - assets/css
  - assets/fonts
  - assets/html
  - assets/js
  - assets/json
  - assets/jupyter
  - assets/plotly
  - assets/video
  - assets/webfonts
  - assets/img/book_covers
  - assets/pdf/example_pdf.pdf
  - assets/minimal-light/LICENSE
  - bin
  - CONTRIBUTING.md
  - CUSTOMIZE.md
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - FAQ.md
  - Gemfile
  - Gemfile.lock
  - INSTALL.md
  - LICENSE
  - lighthouse_results
  - package.json
  - package-lock.json
  - purgecss.config.js
  - README.md
  - readme_preview
  - requirements.txt
  - vendor
keep_files: [CNAME, .nojekyll]

# Do not load al-folio's custom plugins or their build-time network requests.
plugins_dir: []
plugins:
  - jekyll-scholar
  - jekyll-sitemap

collections:
  news:
    output: true

scholar:
  source: ./_bibliography
  bibliography: papers.bib
  bibliography_template: minimal-bib
  style: apa
  locale: en
  sort_by: year,sortkey,month
  order: descending
  group_by: year
  group_order: descending
  bibtex_filters: [latex]
  replace_strings: true
  join_strings: true

defaults:
  - scope:
      path: assets
    values:
      sitemap: false
